{{- $pool := and (not .Values.poolToken.existingSecret) .Values.poolToken.value }}
{{- $claude := and (not .Values.claudeCredential.existingSecret) .Values.claudeCredential.value }}
{{- if or $pool $claude }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ferrfleet-runner.fullname" . }}
  labels:
    {{- include "ferrfleet-runner.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $pool }}
  {{ .Values.poolToken.key }}: {{ .Values.poolToken.value | quote }}
  {{- end }}
  {{- if $claude }}
  {{ .Values.claudeCredential.key }}: {{ .Values.claudeCredential.value | quote }}
  {{- end }}
{{- end }}
