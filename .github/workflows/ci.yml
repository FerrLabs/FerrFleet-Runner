name: CI

on:
  push:
    branches: [main]
  pull_request:

# GitHub-hosted, not the org's self-hosted pool. This repository is public, so a
# fork's pull request can propose the workflow that runs on it; pointing that at
# our own cluster would hand an arbitrary contributor a shell on it.
env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install the toolchain
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Format
        run: cargo fmt --all -- --check

      # The whole workspace, not the current package. The root manifest here is
      # virtual so `cargo test` would cover both members anyway, but saying it
      # explicitly is what keeps that true if a root package is ever added.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Build
        run: cargo build --workspace --release

  deny:
    name: Cargo Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2
        with:
          tool: cargo-deny

      - name: cargo deny
        run: cargo deny check

  musl:
    name: Static binary
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install the toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install stable --profile minimal
          rustup target add "${TARGET}"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${TARGET}" --bin ferrfleet-runner

      - name: The binary runs on a bare image and completes a TLS handshake
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -uo pipefail
          out=$(docker run --rm \
            -v "${PWD}/target/${TARGET}/release:/b:ro" \
            -e FERRFLEET_API_URL=https://example.com \
            -e FERRFLEET_RUN_ID=01999999-9999-7999-9999-999999999999 \
            -e FERRFLEET_RUN_TOKEN=not-a-real-token \
            alpine:3 /b/ferrfleet-runner 2>&1 || true)
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qiE 'CryptoProvider|invalid peer certificate|UnknownIssuer'; then
            echo "::error::the static binary cannot negotiate TLS"
            exit 1
          fi
          printf '%s' "$out" | grep -q 'HTTP status client error' || {
            echo "::error::no HTTP response came back, so nothing proves TLS worked"
            exit 1
          }

  image:
    name: Image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Built but not pushed. A pull request must not be able to publish, and
      # an image that only breaks at release time breaks at the worst moment.
      - name: Build the image
        run: docker build --tag ferrfleet-runner:ci .

      # A TLS backend that cannot handshake still builds, still passes clippy
      # and still starts. It fails at the first request, in someone else's
      # pipeline. This is the only step that makes the binary open a real
      # connection.
      - name: The image completes a TLS handshake
        run: |
          set -uo pipefail
          out=$(docker run --rm \
            -e FERRFLEET_API_URL=https://example.com \
            -e FERRFLEET_RUN_ID=01999999-9999-7999-9999-999999999999 \
            -e FERRFLEET_RUN_TOKEN=not-a-real-token \
            ferrfleet-runner:ci 2>&1 || true)
          printf '%s\n' "$out"
          if printf '%s' "$out" | grep -qiE 'CryptoProvider|invalid peer certificate|UnknownIssuer'; then
            echo "::error::the image cannot negotiate TLS"
            exit 1
          fi
          printf '%s' "$out" | grep -q 'HTTP status client error' || {
            echo "::error::no HTTP response came back, so nothing proves TLS worked"
            exit 1
          }

  action:
    name: Action manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The action is the surface most people will meet first, and its whole
      # body is a shell script inside a YAML string: neither the Rust build nor
      # a human review reliably catches a quoting mistake in there.
      - name: Lint the workflows and the action
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2
        with:
          shellcheck: true

  chart:
    name: Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v4.2.3

      - name: Lint
        run: |
          for values in charts/ferrfleet-runner/ci/*-values.yaml; do
            helm lint charts/ferrfleet-runner --strict --values "${values}"
          done

      - name: Render
        run: |
          mkdir rendered
          helm template ferrfleet-runner charts/ferrfleet-runner \
            --values charts/ferrfleet-runner/ci/default-values.yaml > rendered/scaledjob.yaml
          helm template ferrfleet-runner charts/ferrfleet-runner \
            --values charts/ferrfleet-runner/ci/deployment-values.yaml > rendered/deployment.yaml
          grep -q 'kind: ScaledJob' rendered/scaledjob.yaml
          grep -q -- '- --ephemeral' rendered/scaledjob.yaml
          grep -q 'kind: Deployment' rendered/deployment.yaml
          if grep -q -e 'keda.sh' -e '--ephemeral' rendered/deployment.yaml; then
            echo "::error::deployment mode rendered KEDA objects or an ephemeral runner"
            exit 1
          fi

      - name: Refuse a release without a pool token
        run: |
          if helm template ferrfleet-runner charts/ferrfleet-runner >/dev/null 2>&1; then
            echo "::error::the chart rendered without a pool token"
            exit 1
          fi

      - name: Validate against the Kubernetes and KEDA schemas
        run: |
          docker run --rm -v "${PWD}/rendered:/rendered:ro" \
            ghcr.io/yannh/kubeconform@sha256:faffaf43f95aa6425306e1ab8d6fcad72acb9049158f38e574c085ea1ec0f64e \
            -strict -summary -kubernetes-version 1.32.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /rendered
