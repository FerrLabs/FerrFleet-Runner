name: Release

on:
  push:
    # Full versions only. The moving major tag (`v1`) is what
    # `uses: FerrLabs/FerrFleet-Runner@v1` resolves against, and it gets
    # repointed at every release. Triggering on it would rebuild the same
    # commit, and `type=semver` produces nothing from a bare `v1` anyway, so
    # the run would publish an image under no tag at all.
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ferrlabs/ferrfleet/runner

permissions:
  contents: read

jobs:
  publish:
    name: Publish a signed image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this OIDC token for a short-lived
      # certificate bound to this workflow's identity, so what a verifier
      # checks is "built by this workflow in this repository" rather than
      # "signed by whoever holds a key we have to store somewhere".
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # A moving major tag for people who want fixes without a bump, the
          # full version for people who want to know what they pinned, and the
          # digest below for people who mean it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}

      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance and SBOM ride with the image rather than as a separate
          # artefact nobody fetches.
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # By digest, never by tag: a tag can move between the push above and this
      # step, and signing whatever the tag points at then signs something else.
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Say what to verify against
        run: |
          echo "Pushed ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```bash'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/FerrLabs/FerrFleet-Runner/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
