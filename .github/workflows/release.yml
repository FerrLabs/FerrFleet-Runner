name: Release

on:
  push:
    # Full versions only. The moving major tag (`v1`) is what
    # `uses: FerrLabs/FerrFleet-Runner@v1` resolves against, and it gets
    # repointed at every release. Triggering on it would rebuild the same
    # commit, and `type=semver` produces nothing from a bare `v1` anyway, so
    # the run would publish an image under no tag at all.
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/ferrlabs/ferrfleet/runner

permissions:
  contents: read

jobs:
  publish:
    name: Publish a signed image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # Keyless signing: cosign exchanges this OIDC token for a short-lived
      # certificate bound to this workflow's identity, so what a verifier
      # checks is "built by this workflow in this repository" rather than
      # "signed by whoever holds a key we have to store somewhere".
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.IMAGE }}
          # A moving major tag for people who want fixes without a bump, the
          # full version for people who want to know what they pinned, and the
          # digest below for people who mean it.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}

      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance and SBOM ride with the image rather than as a separate
          # artefact nobody fetches.
          provenance: mode=max
          sbom: true

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # By digest, never by tag: a tag can move between the push above and this
      # step, and signing whatever the tag points at then signs something else.
      - name: Sign the image
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

      - name: Say what to verify against
        run: |
          echo "Pushed ${IMAGE}@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```bash'
            echo "cosign verify ${IMAGE}@${DIGEST} \\"
            echo "  --certificate-identity-regexp '^https://github.com/FerrLabs/FerrFleet-Runner/' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}

  binaries:
    name: Build ${{ matrix.target }}
    # A dispatch has no tag, and the assets below are attached to one.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # musl rather than glibc, and each target built on its own architecture
      # rather than cross-compiled. The result is a static binary that runs on
      # a distroless or alpine runner and does not care which glibc the host
      # shipped, which is the whole point of offering a binary at all.
      - name: Install the toolchain
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
          rustup toolchain install stable --profile minimal
          rustup target add "${TARGET}"

      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked --target "${TARGET}" --bin ferrfleet-runner

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          tar -czf "ferrfleet-runner-${TARGET}.tar.gz" \
            -C "target/${TARGET}/release" ferrfleet-runner \
            -C "${GITHUB_WORKSPACE}" LICENSE

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ferrfleet-runner-${{ matrix.target }}
          path: ferrfleet-runner-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Publish the release
    needs: binaries
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum ferrfleet-runner-*.tar.gz > checksums.txt
          cat checksums.txt

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # One signature over the checksums rather than one per archive: the
      # checksums cover every asset, so a verifier checks one bundle and then
      # the hashes. The action verifies the hashes only, which catches a
      # truncated download; this bundle is what catches a swapped asset, for
      # anyone who checks it.
      - name: Sign the checksums
        run: cosign sign-blob --yes --bundle dist/checksums.txt.bundle dist/checksums.txt

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${TAG}" \
            --generate-notes \
            dist/*
