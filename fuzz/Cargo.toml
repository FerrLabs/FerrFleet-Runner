[package]
name = "ferrfleet-runner-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
anyhow = "1"
chrono = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["process"] }
tracing = "0.1"
ferrfleet-shared = { path = "../shared" }

[workspace]

[[bin]]
name = "claude_stream"
path = "fuzz_targets/claude_stream.rs"
test = false
doc = false
bench = false

[[bin]]
name = "claude_version"
path = "fuzz_targets/claude_version.rs"
test = false
doc = false
bench = false

[[bin]]
name = "branch_name"
path = "fuzz_targets/branch_name.rs"
test = false
doc = false
bench = false

[[bin]]
name = "prompt_parts"
path = "fuzz_targets/prompt_parts.rs"
test = false
doc = false
bench = false
